<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mark — Nixon Made</title>
    <meta
      name="description"
      content="Nixon Made wordmark and stamp files for print and merch."
    />
    <link rel="canonical" href="https://nixonmade.com/brand/" />
    <link rel="icon" href="/brand/press-stamp.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="brand-page">
    <header class="hero">
      <h1 class="wordmark">
        <a href="/">
          <img
            src="/brand/press-stamp.svg"
            alt="Nixon Made"
            width="520"
            height="520"
          />
        </a>
      </h1>
    </header>

    <main>
      <p class="lede">
        Outlined SVGs. One or two colors. Don’t stretch. The site mark is a
        circular ink-press stamp. The square postage stamp is for the cream
        tee.
      </p>

      <section aria-labelledby="print-heading">
        <h2 id="print-heading">Print</h2>
        <div class="grid">
          <figure class="card">
            <img src="/brand/press-stamp.svg" alt="Circular ink-press stamp" />
            <figcaption>
              <a href="/brand/press-stamp.svg" download>press-stamp.svg</a>
              — site, posters, press stamp tee
            </figcaption>
          </figure>
          <figure class="card">
            <img src="/brand/stacked.svg" alt="Square postage stamp, ink and oxblood" />
            <figcaption>
              <a href="/brand/stacked.svg" download>stacked.svg</a>
              — postage stamp tee
            </figcaption>
          </figure>
          <figure class="card">
            <img src="/brand/stamp-ink.svg" alt="Stamp lockup in ink" />
            <figcaption>
              <a href="/brand/stamp-ink.svg" download>stamp-ink.svg</a>
              — hats, patches, stickers
            </figcaption>
          </figure>
          <figure class="card ink">
            <img
              src="/brand/stacked-inverse.svg"
              alt="Stacked wordmark, cream on dark"
            />
            <figcaption>
              <a href="/brand/stacked-inverse.svg" download>stacked-inverse.svg</a>
              — dark merch
            </figcaption>
          </figure>
          <figure class="card ink">
            <img src="/brand/stamp-inverse.svg" alt="Stamp lockup, cream on dark" />
            <figcaption>
              <a href="/brand/stamp-inverse.svg" download>stamp-inverse.svg</a>
              — dark hats and stickers
            </figcaption>
          </figure>
        </div>
      </section>

      <footer>
        <p>
          <a href="/">Shop</a>
          <span class="dot" aria-hidden="true">·</span>
          Single-color files in
          <a href="https://github.com/dedwebs/nixonmade/tree/main/public/brand">/brand</a>
        </p>
      </footer>
    </main>
  </body>
</html>
